# LEGACY: the old Caddy-based setup, no longer used in production (Traefik in
# vps-infra serves zanuar.dev, see docker-compose.traefik.yml). Kept for
# standalone use only. Do not run this on the VPS.
services:
  web:
    build: .
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
