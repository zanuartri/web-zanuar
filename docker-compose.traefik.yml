# Production compose for zanuar.dev. The shared Traefik in ~/vps-infra owns
# ports 80/443 and routes to this container via the labels below. Deploy with:
#   sudo docker compose -f docker-compose.traefik.yml up -d --build
# Do NOT use the plain docker-compose.yml on the VPS: it drops these labels and
# zanuar.dev returns 404 (happened 2026-11-25).
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - shared-infra
    labels:
      - traefik.enable=true
      - traefik.docker.network=shared-infra
      - traefik.http.routers.zanuar.rule=Host(`zanuar.dev`) || Host(`www.zanuar.dev`)
      - traefik.http.routers.zanuar.entrypoints=websecure
      - traefik.http.routers.zanuar.tls.certresolver=le
      - traefik.http.services.zanuar.loadbalancer.server.port=3000

networks:
  shared-infra:
    external: true
